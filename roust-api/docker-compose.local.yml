# Local Docker hot-reload WebUI for roust (Windows API stays on the host).
# Usage: docker compose -f docker-compose.local.yml -p roust up -d
name: roust
services:
  webui:
    image: node:22-alpine
    restart: "no"
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_BASE_PATH: "/roust/"
      VITE_API_PROXY_TARGET: "http://host.docker.internal:8787"
      VITE_HMR_CLIENT_PORT: "80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - sh
      - -c
      - npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    volumes:
      - ../roust-webui:/app
      - roust-webui-node-modules:/app/node_modules
    ports:
      - "5183:5173"
    networks:
      - default
      - pc-armin-local

volumes:
  roust-webui-node-modules:

networks:
  pc-armin-local:
    name: pc-armin-local
    external: true
